plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// compile with JDK 17 like the main project, so the output doesn't depend on the JDK that runs Gradle
tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group ='com.blockforge.launcher'
version = rootProject.file('src/main/resources/version').text.trim().replace('.Beta', '')

application {
    mainClass = 'com.blockforge.launcher.mclauncher.legacy.LegacyMCLauncher'
}
