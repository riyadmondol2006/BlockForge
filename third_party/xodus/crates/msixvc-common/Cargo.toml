[package]
name = "msixvc-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
tokio = { version = "1.53.1", features = ["full", "tracing"] }
chrono = "0.4.45"
thiserror = "2.0.20"
uuid = "1.25.0"
typenum = { version = "1.20.1", features = ["const-generics"] }
generic-array = "1.4.5"
bitflags = "2.13.1"
num_enum = "0.7.6"
async-trait = "0.1.92"
bytes = "1.12.1"

[dev-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
