[package]
name = "bedrock-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The name it is packaged under, beside `blockforge` and `blockforge-bedrock-auth`.
[[bin]]
name = "blockforge-bedrock-runtime"
path = "src/main.rs"
