name: Bug report
description: Something doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BlockForge version
      description: Shown in the launcher log, or run with --version.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Fedora / RPM Linux, Debian / Ubuntu, Other Linux]
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Support bundle
      description: In BlockForge open Tools, choose "Support bundle", then drag the ZIP in here. It has personal details removed, you can open it to check.
