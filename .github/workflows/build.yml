name: Build

# Every push and pull request is checked (format, lint, tests) and built for every system. Download the builds from
# the run's "Artifacts" section.
#
# Pushes to main also publish them on the Releases page:
#   - "v<version>" (the version in Cargo.toml) becomes a normal release, marked as the latest one, the first time that
#     version is built. Raising the version and pushing to main is all it takes to release; pushing a v* tag yourself
#     works too.
#   - "nightly" is a prerelease that always holds the files of the newest main build.
# Running the workflow by hand with "Make a draft release" on checks the whole publishing step without showing
# anything to the public.
#
# File names (the updater of every BlockForge version picks its download by these endings, so each ending must belong
# to exactly one file):
#   BlockForge-<version>-windows-x64-setup.exe      the Windows installer
#   BlockForge-<version>-windows-x64-portable.zip   blockforge.exe on its own
#   BlockForge-<version>-macos-arm64.dmg
#   BlockForge-<version>-linux-x86_64.deb / .rpm / .AppImage
#   BlockForge-<version>.jar                        bridge that moves old jar installs to the native build
#   SHA256SUMS.txt
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Make a draft release (not visible to the public) to test publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # a newer push replaces a running build, except on main and tags, where a build may be publishing a release
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: Format, lint and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Read the version
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          case "$version" in *[!0-9.]*|"") echo "::error::can't read a version from Cargo.toml"; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      - run: cargo fmt --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release

  linux:
    name: Linux packages (deb, rpm, AppImage)
    needs: checks
    # the oldest runner on purpose: a program built on an older system runs on newer ones, not the other way round
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev rpm squashfs-tools desktop-file-utils appstream curl file
      - name: Build the packages
        run: |
          set -o pipefail
          ./packaging/linux/build.sh "$VERSION" 2>&1 | tee build.log || { .github/scripts/why.sh build.log "Building the Linux packages"; exit 1; }
      - name: Check the deb on this system
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/BlockForge-$VERSION-linux-*.deb
          blockforge --version
          desktop-file-validate /usr/share/applications/blockforge.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/blockforge.png
      - name: Check the rpm on a clean Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c \
            'dnf install -y /dist/BlockForge-*-linux-*.rpm && blockforge --version && test -f /usr/share/applications/blockforge.desktop'
      - name: Check the AppImage
        run: |
          chmod +x dist/BlockForge-$VERSION-linux-*.AppImage
          dist/BlockForge-$VERSION-linux-*.AppImage --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v7
        with:
          name: BlockForge-linux
          path: |
            dist/BlockForge-${{ env.VERSION }}-linux-*.deb
            dist/BlockForge-${{ env.VERSION }}-linux-*.rpm
            dist/BlockForge-${{ env.VERSION }}-linux-*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer and exe
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Build the installer and the portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ./packaging/windows/build.ps1 -Version $env:VERSION *>&1 | Tee-Object -FilePath build.log
          if (-not $? -or ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0)) {
            $tail = ((Get-Content build.log -Tail 40) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=Building the Windows installer failed::$tail"
            exit 1
          }
      - name: Check the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ./packaging/windows/smoke.ps1 -Version $env:VERSION *>&1 | Tee-Object -FilePath smoke.log
          if (-not $? -or ($LASTEXITCODE -ne $null -and $LASTEXITCODE -ne 0)) {
            $tail = ((Get-Content smoke.log -Tail 40) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=Checking the Windows installer failed::$tail"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: BlockForge-windows
          path: |
            dist/BlockForge-${{ env.VERSION }}-windows-x64-setup.exe
            dist/BlockForge-${{ env.VERSION }}-windows-x64-portable.zip
          if-no-files-found: error

  macos:
    name: macOS disk image (Apple Silicon)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      # the oldest macOS the disk image says it runs on; the program is built for it
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Build the disk image
        run: |
          set -o pipefail
          ./packaging/macos/build.sh "$VERSION" 2>&1 | tee build.log || { .github/scripts/why.sh build.log "Building the macOS disk image"; exit 1; }
      - name: Check the disk image
        run: |
          set -o pipefail
          ./packaging/macos/smoke.sh "dist/BlockForge-$VERSION-macos-arm64.dmg" 2>&1 | tee smoke.log || { .github/scripts/why.sh smoke.log "Checking the macOS disk image"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: BlockForge-macos
          path: dist/BlockForge-${{ env.VERSION }}-macos-arm64.dmg
          if-no-files-found: error

  bridge:
    name: Bridge jar for old installs
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: OUT="$PWD/dist" ./packaging/bridge/build.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: BlockForge-bridge
          path: dist/BlockForge-${{ env.VERSION }}.jar
          if-no-files-found: error

  agents:
    # the two helpers the launcher starts the game with (packaging/boost and packaging/lite) run inside the game's
    # Java on the player's computer, so they are checked on every system with every Java Minecraft uses
    name: Game helpers (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
        java: [8, 17, 21, 25]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Self-tests of the committed jars (the ones the launcher embeds)
        run: |
          java -version
          java -cp packaging/lite/blockforge-lite.jar com.blockforge.lite.SelfTest
          if jar tf packaging/boost/blockforge-boost.jar | grep -q "com/blockforge/boost/SelfTest.class"; then
            java -cp packaging/boost/blockforge-boost.jar com.blockforge.boost.SelfTest
          fi
      - name: Both start as agents of one Java, from a folder with a space in its name
        run: |
          mkdir -p "agent test"
          java -javaagent:packaging/boost/blockforge-boost.jar=preload="agent test/x.classes" \
            -javaagent:packaging/lite/blockforge-lite.jar=report="agent test/lite.txt" -version 2>&1 | tee agents.txt
          if grep -q "problem\|Error occurred\|agent library failed" agents.txt; then
            echo "::error::an agent reported a problem"; exit 1
          fi
      - name: The jars build from their sources and the builds pass the self-tests
        # javac 8 can't compile for an older release; the jars are built with a newer JDK and run on Java 8
        if: matrix.java != 8
        run: |
          # a failure says what went wrong in its annotation (the log of a finished job needs a sign-in to read)
          step() {
            if ! out="$("$@" 2>&1)"; then
              echo "$out" | tail -40
              echo "::error::$* failed: $(echo "$out" | tail -12 | tr '\n' '|' | cut -c1-1500)"
              exit 1
            fi
            echo "$out" | tail -3
          }
          export OUT="$PWD/built"
          step ./packaging/boost/build.sh
          step ./packaging/lite/build.sh
          for j in boost lite; do
            if cmp -s "built/blockforge-$j.jar" "packaging/$j/blockforge-$j.jar"; then
              echo "blockforge-$j.jar: the build is identical to the committed jar"
            else
              echo "::notice::blockforge-$j.jar built with Java ${{ matrix.java }} differs from the committed one"
            fi
          done

  release:
    name: Publish
    needs: [checks, linux, windows, macos, bridge, agents]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.draft_release)
    permissions:
      contents: write
    # never publish two builds at the same time
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.checks.outputs.version }}
      DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
      UNSIGNED: >-
        The installers aren't signed yet: on Windows choose "More info" and then "Run anyway", on macOS right-click
        BlockForge and choose Open the first time.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: BlockForge-*
          merge-multiple: true
      - name: Check that every file is there
        working-directory: artifacts
        run: |
          for f in "BlockForge-$VERSION.jar" \
              "BlockForge-$VERSION-windows-x64-setup.exe" "BlockForge-$VERSION-windows-x64-portable.zip" \
              "BlockForge-$VERSION-macos-arm64.dmg" \
              "BlockForge-$VERSION-linux-x86_64.deb" "BlockForge-$VERSION-linux-x86_64.rpm" \
              "BlockForge-$VERSION-linux-x86_64.AppImage"; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          # the updater of older versions takes the one file with the right ending, so no ending may appear twice
          for ext in exe dmg deb rpm jar; do
            n="$(ls -1 ./*."$ext" 2>/dev/null | wc -l)"
            [ "$n" -eq 1 ] || { echo "::error::expected exactly one .$ext file, found $n"; exit 1; }
          done
          sha256sum BlockForge-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # the sizes, as a notice on the run page
          echo "::notice title=Release files::$(ls -l BlockForge-* SHA256SUMS.txt | awk 'BEGIN { ORS = "%0A" } { printf "%s %.1f MB", $9, $5 / 1048576 }')"
      - name: Write the release notes
        run: |
          {
            # the section of CHANGELOG.md for this version, if there is one
            awk -v v="$VERSION" '$0 ~ "^## " v "([^0-9.]|$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md
            echo
            echo "$UNSIGNED"
          } > notes.md
          cat notes.md
      - name: Release v${{ needs.checks.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$VERSION"; fi
          if [ "$DRAFT" = true ]; then
            # a draft is only for checking the steps: it makes no tag and nobody but the owner sees it
            # only an earlier draft is replaced; a published release is never touched
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
              gh release delete "$tag" --yes
            fi
            gh release create "$tag" artifacts/* --draft --target "$GITHUB_SHA" --title "BlockForge $VERSION (test)" \
              --notes-file notes.md
            gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'
            exit 0
          fi
          # the commit the tag points at, if the tag exists already
          tagged="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null || true)"
          case "$tagged" in *[!0-9a-f]*) tagged="" ;; esac
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::notice::$tag was already released from $tagged. Raise the version in Cargo.toml to publish a new release."
            exit 0
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            # a re-run of the same build: refresh the files
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --title "BlockForge $VERSION" \
              --notes-file notes.md --latest
          fi
      - name: Update the nightly build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # move the nightly tag to this commit, or make it
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" > /dev/null
          fi
          notes="The newest build from main ($GITHUB_SHA). $UNSIGNED"
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --title "Nightly build" --notes "$notes" --prerelease --latest=false
            gh release upload nightly artifacts/* --clobber
            # remove files that this build didn't make, so old versions don't pile up
            gh release view nightly --json assets --jq '.assets[].name' | while read -r name; do
              [ -f "artifacts/$name" ] || gh release delete-asset nightly "$name" --yes
            done
          else
            gh release create nightly artifacts/* --verify-tag --title "Nightly build" --notes "$notes" \
              --prerelease --latest=false
          fi
