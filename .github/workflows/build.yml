name: Build

# Every push builds a jar and an installer for Debian, Fedora, Windows and macOS. Download them from the run's
# "Artifacts" section. Pushes to master also update the "nightly" release, and tags like v3.4.41.4 make a release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
      - run: ./gradlew --no-daemon test

  jar:
    name: Jar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
      - run: ./gradlew --no-daemon shadowJar
      - name: Read the version
        id: version
        run: echo "version=$(tr -d ' \t\r\n' < src/main/resources/version | sed 's/\.Beta$//')" >> "$GITHUB_OUTPUT"
      - name: Check that the jar starts
        run: java -jar build/libs/BlockForge-*.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: BlockForge-jar
          path: build/libs/BlockForge-*.jar
          if-no-files-found: error

  linux:
    name: Debian and Fedora packages
    needs: jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg-dev desktop-file-utils
      - uses: actions/download-artifact@v4
        with:
          name: BlockForge-jar
          path: build/libs
      - name: Build the packages
        run: |
          scripts/package.sh deb build/libs/BlockForge-*.jar build/installers
          scripts/package.sh rpm build/libs/BlockForge-*.jar build/installers
      - name: Check the packages
        run: |
          dpkg-deb --info build/installers/*.deb
          dpkg-deb --contents build/installers/*.deb | grep -E 'bin/BlockForge$|\.desktop$|BlockForge\.png$'
          rpm -qpl build/installers/*.rpm | grep -E 'bin/BlockForge$|\.desktop$|BlockForge\.png$'
          dpkg-deb -x build/installers/*.deb /tmp/deb-root
          desktop-file-validate /tmp/deb-root/opt/blockforge/lib/blockforge-BlockForge.desktop
          /tmp/deb-root/opt/blockforge/bin/BlockForge --version
      - name: Name the files for what they are
        run: |
          cd build/installers
          V="${{ needs.jar.outputs.version }}"
          mv blockforge_*_amd64.deb "BlockForge-$V-debian-ubuntu-amd64.deb"
          mv blockforge-*.x86_64.rpm "BlockForge-$V-fedora-x86_64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: BlockForge-Debian-Ubuntu-deb
          path: build/installers/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BlockForge-Fedora-rpm
          path: build/installers/*.rpm
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: jar
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make sure the WiX Toolset is installed
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $bin = Get-Item "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $bin) {
              choco install wixtoolset -y --no-progress
              $bin = Get-Item "C:\Program Files (x86)\WiX Toolset*\bin" | Select-Object -First 1
            }
            $bin.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - uses: actions/download-artifact@v4
        with:
          name: BlockForge-jar
          path: build/libs
      - name: Build the installer
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BlockForge-Windows-exe
          path: build/installers/*.exe
          if-no-files-found: error

  macos:
    name: macOS installer (${{ matrix.name }})
    needs: jar
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: Apple Silicon
            arch: arm64
          - runner: macos-15-intel
            name: Intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: BlockForge-jar
          path: build/libs
      - name: Build the disk image
        run: scripts/package.sh dmg build/libs/BlockForge-*.jar build/installers
      - name: Name the file for what it is
        run: |
          cd build/installers
          mv BlockForge-*.dmg "BlockForge-${{ needs.jar.outputs.version }}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: BlockForge-macOS-${{ matrix.arch }}-dmg
          path: build/installers/*.dmg
          if-no-files-found: error

  release:
    name: Publish
    needs: [jar, linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # nightly builds from master, and a normal release for version tags
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List what will be published
        run: ls -la artifacts
      - name: Nightly release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly build
          prerelease: true
          make_latest: false
          body: |
            Built from the latest commit on master (${{ github.sha }}). These builds aren't signed. On Windows choose
            "More info" > "Run anyway". On macOS right-click the app and choose Open the first time.
          files: artifacts/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
