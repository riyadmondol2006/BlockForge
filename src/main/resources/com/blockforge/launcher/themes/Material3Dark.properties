# This inherits from
# ./ATLauncherLaf.properties
# ./Dark.properties
# FlatLaf's FlatDarkLaf.properties and FlatLaf.properties

#---- Material 3 colour roles (generated from a green seed) ----
md.primary=#78DC77
md.onPrimary=#003A03
md.primaryContainer=#005313
md.onPrimaryContainer=#94F990
md.secondaryContainer=#3B4B38
md.onSecondaryContainer=#D6E8CE
md.surface=#10140F
md.onSurface=#E0E4DB
md.onSurfaceVariant=#C2C9BD
md.outline=#8C9388
md.outlineVariant=#424940
md.surfaceContainerLowest=#0B0F0A
md.surfaceContainerLow=#181D17
md.surfaceContainer=#1C201A
md.surfaceContainerHigh=#262B24
md.surfaceContainerHighest=#31362F
md.error=#FFB4AB
md.onError=#690005

#---- Re-point the base palette at Material roles ----
primary.100=$md.onPrimaryContainer
primary.200=$md.primaryContainer
primary.500=$md.primary
primary.600=$md.primary
secondary.500=$md.surfaceContainerHigh
secondary.600=$md.surfaceContainerHigh
red=$md.error
yellow=#F6E05E

#---- globals ----
@background=$md.surface
@foreground=$md.onSurface
@selectionBackground=$md.primaryContainer
@selectionForeground=$md.onPrimaryContainer
@accentColor=$md.primary
@componentBackground=$md.surfaceContainerLow
*.errorForeground=$md.error
*.selectionInactiveBackground=$md.secondaryContainer
*.selectionBackgroundInactive=$md.secondaryContainer

buttonBackground=$md.secondaryContainer
buttonBorder=$md.secondaryContainer
border=$md.outline
focusedBorder=$md.primary
checkboxBackground=$md.surface
checkboxCheck=$md.onPrimary
separatorColor=$md.outlineVariant
tabActive=$md.surfaceContainerHigh
Separator.foreground=$md.outlineVariant

#---- shape: Material uses large rounded corners ----
Component.arc=16
Component.borderColor=$md.outline
Component.disabledBorderColor=$md.outlineVariant
Component.focusedBorderColor=$md.primary
Component.focusColor=$md.primary
Component.focusWidth=0
Component.innerFocusWidth=0
Component.borderWidth=1
Component.arrowType=chevron
TextComponent.arc=10
CheckBox.arc=4
ScrollPane.arc=0
ScrollPane.TextComponent.arc=10
ProgressBar.arc=999
Slider.trackWidth=4
Slider.thumbSize=16,16

#---- Button: filled tonal, pill shaped. Default buttons are filled primary ----
Button.arc=999
Button.borderWidth=0
Button.default.borderWidth=0
Button.shadowWidth=0
Button.margin=7,24,7,24
Button.minimumWidth=64
Button.background=$md.secondaryContainer
Button.foreground=$md.onSecondaryContainer
Button.hoverBackground=lighten($md.secondaryContainer,5%)
Button.pressedBackground=lighten($md.secondaryContainer,9%)
Button.focusedBackground=$md.secondaryContainer
Button.borderColor=$md.secondaryContainer
Button.hoverBorderColor=$md.secondaryContainer
Button.focusedBorderColor=$md.primary
Button.disabledBackground=$md.surfaceContainerHigh
Button.disabledText=$md.outline
Button.default.background=$md.primary
Button.default.foreground=$md.onPrimary
Button.default.hoverBackground=lighten($md.primary,6%)
Button.default.pressedBackground=lighten($md.primary,10%)
Button.default.focusedBackground=$md.primary
Button.default.borderColor=$md.primary
Button.default.hoverBorderColor=$md.primary
Button.default.focusedBorderColor=$md.primary
Button.default.shadow=$transparent
Button.toolbar.hoverBackground=$md.surfaceContainerHigh
Button.toolbar.pressedBackground=$md.surfaceContainerHighest

#---- Checkbox / radio / toggle ----
CheckBox.icon.borderColor=$md.outline
CheckBox.icon.selectedBorderColor=$md.primary
CheckBox.icon.selectedBackground=$md.primary
CheckBox.icon.background=$md.surface
CheckBox.icon.checkmarkColor=$md.onPrimary
CheckBox.icon.focusedBorderColor=$md.primary
CheckBox.icon.focusedSelectedBorderColor=$md.primary
CheckBox.icon.hoverBorderColor=$md.onSurface
CheckBox.icon.selectedHoverBackground=$md.primary
CheckBox.icon.focusedBackground=$md.surface
RadioButton.icon.centerDiameter=8
RadioButton.icon.borderColor=$md.outline
RadioButton.icon.selectedBorderColor=$md.primary
RadioButton.icon.selectedBackground=$md.surface
RadioButton.icon.centerColor=$md.primary
RadioButton.icon.background=$md.surface
ToggleButton.selectedBackground=$md.secondaryContainer
ToggleButton.selectedForeground=$md.onSecondaryContainer
ToggleButton.background=$md.surface
ToggleButton.arc=999

#---- Text fields: outlined ----
TextField.background=$md.surface
PasswordField.background=$md.surface
FormattedTextField.background=$md.surface
TextArea.background=$md.surface
TextPane.background=$md.surface
EditorPane.background=$md.surface
Spinner.background=$md.surface
ComboBox.background=$md.surface
ComboBox.buttonBackground=$md.surface
ComboBox.buttonEditableBackground=$md.surface
ComboBox.buttonArrowColor=$md.onSurfaceVariant
ComboBox.buttonSeparatorColor=$md.surface
ComboBox.popupBackground=$md.surfaceContainer
ComboBox.selectionBackground=$md.secondaryContainer
ComboBox.selectionForeground=$md.onSecondaryContainer
TextField.placeholderForeground=$md.onSurfaceVariant
TextComponent.arc=10

#---- Lists, tables, trees ----
List.background=$md.surface
Table.background=$md.surface
Tree.background=$md.surface
Table.gridColor=$md.outlineVariant
Table.showHorizontalLines=true
Table.showVerticalLines=false
Table.intercellSpacing=0,1
Table.rowHeight=32
TableHeader.background=$md.surfaceContainer
TableHeader.foreground=$md.onSurfaceVariant
TableHeader.bottomSeparatorColor=$md.outlineVariant
TableHeader.separatorColor=$md.surfaceContainer
Table.selectionBackground=$md.primaryContainer
Table.selectionForeground=$md.onPrimaryContainer
List.selectionBackground=$md.primaryContainer
List.selectionForeground=$md.onPrimaryContainer
Mods.modSelectionColor=$md.surfaceContainerHigh

#---- Tabs: Material primary tabs with a 3dp indicator ----
TabbedPane.background=$md.surfaceContainer
TabbedPane.foreground=$md.onSurfaceVariant
TabbedPane.selectedForeground=$md.primary
TabbedPane.hoverColor=lighten($md.surfaceContainerHigh,4%)
TabbedPane.focusColor=$md.surfaceContainerHigh
TabbedPane.selectedBackground=$md.surfaceContainer
TabbedPane.underlineColor=$md.primary
TabbedPane.inactiveUnderlineColor=$md.primary
TabbedPane.contentAreaColor=$md.outlineVariant
TabbedPane.tabSeparatorColor=$md.outlineVariant
TabbedPane.tabSeparatorsFullHeight=false
TabbedPane.showTabSeparators=false
TabbedPane.tabSelectionHeight=3
TabbedPane.tabHeight=52
TabbedPane.tabInsets=4,26,4,26
TabbedPane.tabAreaInsets=0,0,0,0
TabbedPane.tabArc=0
TabbedPane.hasFullBorder=false

#---- Scroll bars: thin pill thumbs, no track ----
ScrollBar.width=14
ScrollBar.thumbArc=999
ScrollBar.thumbInsets=3,3,3,3
ScrollBar.trackArc=999
ScrollBar.trackInsets=0,0,0,0
ScrollBar.track=$transparent
ScrollBar.thumb=$md.outlineVariant
ScrollBar.hoverThumbColor=$md.outline
ScrollBar.pressedThumbColor=$md.outline
ScrollBar.hoverTrackColor=$transparent
ScrollBar.showButtons=false

#---- Progress ----
ProgressBar.foreground=$md.primary
ProgressBar.background=$md.surfaceContainerHighest
ProgressBar.selectionForeground=$md.onPrimary
ProgressBar.selectionBackground=$md.onSurface

#---- Slider ----
Slider.thumbColor=$md.primary
Slider.trackValueColor=$md.primary
Slider.trackColor=$md.surfaceContainerHighest
Slider.focusedColor=$md.primary
Slider.hoverThumbColor=$md.primary

#---- Menus and popups ----
PopupMenu.background=$md.surfaceContainer
PopupMenu.borderColor=$md.outlineVariant
PopupMenu.borderCornerRadius=12
PopupMenu.borderInsets=6,0,6,0
Popup.dropShadowOpacity=0.35
MenuItem.background=$md.surfaceContainer
MenuItem.selectionBackground=lighten($md.surfaceContainerHigh,4%)
MenuItem.selectionForeground=$md.onSurface
MenuItem.selectionInsets=0,6,0,6
MenuItem.selectionArc=10
MenuItem.margin=4,12,4,12
Menu.selectionBackground=lighten($md.surfaceContainerHigh,4%)
Menu.selectionForeground=$md.onSurface
CheckBoxMenuItem.selectionBackground=lighten($md.surfaceContainerHigh,4%)
RadioButtonMenuItem.selectionBackground=lighten($md.surfaceContainerHigh,4%)
MenuBar.background=$md.surfaceContainer
ToolTip.background=$md.surfaceContainerHighest
ToolTip.foreground=$md.onSurface
ToolTip.border=6,10,6,10,$md.outlineVariant,1,10
ToolTip.borderColor=$md.outlineVariant

#---- Dialogs / window ----
TitlePane.background=$md.surfaceContainer
TitlePane.inactiveBackground=$md.surfaceContainer
TitlePane.foreground=$md.onSurface
TitlePane.inactiveForeground=$md.onSurfaceVariant
OptionPane.background=$md.surfaceContainerHigh
OptionPane.messageForeground=$md.onSurface
Dialog.background=$md.surfaceContainerHigh
FileChooser.background=$md.surfaceContainerHigh
SplitPane.dividerSize={integer}0
SplitPane.background=$md.surface
SplitPaneDivider.gripColor=$md.outline

#---- BlockForge specific ----
BottomBar.dividerColor=$md.outlineVariant
CollapsiblePanel.normal=$md.onSurface
CollapsiblePanel.warning=#F6E05E
CollapsiblePanel.error=$md.error
Console.LogType.debug=#CFBCFF
Console.LogType.error=$md.error
Console.LogType.info=$md.primary
Console.LogType.warn=#F6E05E
Console.LogType.default=$md.onSurface
HoverLineBorder.borderColor=$md.primary
HoverLineBorder.borderWidth=2
HoverLineBorder.insetWidth=4
ModsJCheckBox.hoverBorderColor=$md.primary
News.headerColor=$md.primary
News.linkColor=$md.primary
Toaster.bgColor=$md.surfaceContainerHighest
Toaster.msgColor=$md.onSurface
Toaster.borderColor=$md.primary
ToolPanel.borderColor=$md.outlineVariant
